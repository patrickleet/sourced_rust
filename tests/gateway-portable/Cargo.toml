[package]
name = "gateway-portable-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["gateway"]
gateway = ["distributed/gateway"]

[dependencies]
distributed = { path = "../..", default-features = false }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "gateway_routing"
path = "../gateway_routing.rs"

[[test]]
name = "gateway_extensions"
path = "../gateway_extensions.rs"

[[test]]
name = "gateway_auth"
path = "../gateway_auth.rs"
