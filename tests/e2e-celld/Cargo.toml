# Sibling of tests/e2e-ui. Same domain crates; new service crates.
# GraphQL wait-dispatches Todo create/complete to celld.
[workspace]
resolver = "2"
members = [
    "crates/todo-service",
    "crates/chat-service",
    "crates/blob-service",
    "crates/graphql-service",
    "crates/runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
distributed = { path = "../..", features = ["sqlite", "postgres", "http", "graphql", "metrics"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
thiserror = "1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
async-trait = "0.1"
