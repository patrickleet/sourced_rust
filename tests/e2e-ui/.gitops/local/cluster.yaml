apiVersion: hops.local/v1alpha1
kind: Cluster
metadata:
  name: e2e-ui
spec:
  clusterProvider: kind
  dockerProvider: dory
  # Mount the distributed checkout so cluster-dev workloads can see both
  # shared packages (js/) and this fixture (tests/e2e-ui/).
  mountRoot: ../../../..
  manifests:
    path: tests/e2e-ui/.gitops/local/cluster
  controlPlane:
    crossplane:
      chart: crossplane-stable/crossplane
      version: "2.4.0"
      values:
        resourcesCrossplane:
          limits:
            cpu: null
            memory: null
          requests:
            cpu: null
            memory: null
        resourcesRBACManager:
          limits:
            cpu: null
            memory: null
          requests:
            cpu: null
            memory: null
