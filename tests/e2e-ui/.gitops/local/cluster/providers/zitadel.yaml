apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-upjet-zitadel
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-upjet-zitadel:v0.1.1
---
apiVersion: zitadel.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: zitadel-credentials
      key: credentials
---
apiVersion: zitadel.m.crossplane.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: zitadel-credentials
      key: credentials
