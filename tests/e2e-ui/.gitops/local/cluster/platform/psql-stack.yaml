# Local platform StorageClass for AuthStack's embedded PostgreSQL.
# The AuthStack owns its database XR; this cluster-level PSQLStack only
# provides the local-path-backed `psql` StorageClass.
apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLStack
metadata:
  name: psql
  namespace: default
spec:
  clusterName: e2e-ui
  helmProviderConfigRef:
    name: default
  kubernetesProviderConfigRef:
    name: default
  storageClass:
    enabled: true
    name: psql
    provisioner: rancher.io/local-path
    allowVolumeExpansion: false
    parameters: {}
  snapshotClass:
    enabled: false
  scaleToZeroPlugin:
    enabled: false
