apiVersion: v1
kind: ServiceAccount
metadata:
  name: hops-local-workbench
  namespace: crossplane-system
  labels:
    app.kubernetes.io/managed-by: hops-local-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hops-local-workbench
  labels:
    app.kubernetes.io/managed-by: hops-local-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: hops-local-workbench
    namespace: crossplane-system
