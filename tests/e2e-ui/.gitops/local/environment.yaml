apiVersion: hops.local/v1alpha1
kind: Environment
metadata:
  name: local
spec:
  clusterRef:
    name: e2e-ui
  # Paths resolve from the Cluster mount root (the distributed checkout).
  # The resolved runtime Environment name defaults its namespace.
  root: tests/e2e-ui
  values:
    local: true
    preview: false
  deploys:
    # Every path is an explicit renderer directory; no chart is inferred.
    - path: api/.gitops/local
      type: helm
      values:
        identity:
          enabled: true
          oidcGeneration: 1
    # Test identities are an explicit, independently rendered deploy.
    - path: ui/.gitops/test-users
      type: helm
      values:
        identity:
          enabled: true
          oidcGeneration: 1
          projectName: e2e-ui
          projectNamespace: default
          humansNamespace: default
          instanceLoginV2: true
          demoUsers: true
          providerConfigRef:
            name: default
            kind: ClusterProviderConfig
