# Nested workspace fixture: e2e-ui (todos + live chat subscriptions).
# Not a member of the main `distributed` workspace — run from this directory:
#   make
#   make test
[workspace]
resolver = "2"
members = [
    "crates/todo-domain",
    "crates/chat-domain",
    "crates/readmodels",
    "crates/service",
    "crates/runner",
    "crates/suite",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
distributed = { path = "../..", features = ["sqlite", "http", "graphql", "metrics"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
thiserror = "1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
