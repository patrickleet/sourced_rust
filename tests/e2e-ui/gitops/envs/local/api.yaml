apiVersion: hops.local/v1alpha1
kind: Application
metadata:
  name: e2e-ui-api
spec:
  source:
    path: ../../../api/.gitops/deploy
    helm:
      values:
        local: true
        appRuntime: cluster-dev
        clusterDev:
          sourceGeneration: 1
        database:
          enabled: false
        # No live project/client UUIDs. The API chart derives the matching
        # workspace Secret and reads the generated client id as its audience.
        identity:
          enabled: true
          oidcGeneration: 1
        secretEnv:
          ZITADEL_SERVICE_USER_TOKEN:
            secretName: e2e-ui-oidc
            key: ZITADEL_SERVICE_USER_TOKEN
  syncPolicy:
    prune: true
