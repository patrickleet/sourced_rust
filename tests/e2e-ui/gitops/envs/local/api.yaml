apiVersion: hops.local/v1alpha1
kind: Application
metadata:
  name: e2e-ui-api
spec:
  source:
    path: ../../../api/.gitops/deploy
    # distributed monorepo root (Cargo workspace lives at tests/e2e-ui)
    deliveryPath: ../../../../..
    helm:
      values:
        local: true
        appRuntime: cluster-dev
        database:
          enabled: false
  destination:
    namespace: hops-wt-default
  syncPolicy:
    prune: false
