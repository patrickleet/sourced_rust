apiVersion: hops.local/v1alpha1
kind: Application
metadata:
  name: e2e-ui-ui
spec:
  source:
    path: ../../../ui/.gitops/deploy
    # Default delivery = git worktree root (shared across UI/API pods).
    # Do not set deliveryPath unless you need a narrower override.
    helm:
      values:
        local: true
        appRuntime: cluster-dev
        # Residual: Zitadel project id for role scopes / API audience (must match
        # Project Ready external-name). Dogfood live project until cluster e2e-ui
        # Project is recreated on current AuthStack.
        env:
          OIDC_AUDIENCE: "385467744310526613"
          ZITADEL_PROJECT_ID: "385467744310526613"
        # Identity: shared Project/roles/humans in default; OIDC + Features in
        # release namespace (hops --name). Login V2 baseUri from chart helpers.
        # orgId after AuthStack Ready: GET …/management/v1/orgs/me
        identity:
          enabled: true
          orgId: "385408591454077587"
          projectName: e2e-ui
          projectNamespace: default
          humansNamespace: default
          # OIDC MR → release namespace (empty = hops injects workspace ns)
          mrNamespace: ""
          # Primary dogfood owns instance Features (global). Second worktree
          # should set instanceLoginV2: false (see dual-worktree suite).
          instanceLoginV2: true
          demoUsers: true
          providerConfigRef:
            name: default
            kind: ClusterProviderConfig
  syncPolicy:
    prune: false
