apiVersion: hops.local/v1alpha1
kind: Application
metadata:
  name: e2e-ui-ui
spec:
  source:
    path: ../../../ui/.gitops/deploy
    # distributed monorepo root (ui needs tests/e2e-ui/ui + js/ for file: dep)
    deliveryPath: ../../../../..
    helm:
      values:
        local: true
        appRuntime: cluster-dev
        # Identity: cluster Project+roles+humans; OIDC app is worktree-scoped.
        # orgId residual after: GET …/management/v1/orgs/me
        identity:
          enabled: true
          # hops-ops org on local AuthStack (GET …/management/v1/orgs/me)
          orgId: "385408591454077587"
          projectName: e2e-ui
          projectNamespace: default
          humansNamespace: default
          mrNamespace: default
          demoUsers: true
          providerConfigRef:
            name: default
            kind: ClusterProviderConfig
  destination:
    namespace: hops-wt-default
  syncPolicy:
    prune: false
