# Local AuthStack: Zitadel + embedded PSQLCluster (owned by this XR).
#
# No ingress/gateway for local first step — Service is ClusterIP only.
# Helm chart fullname is release+chart → Service **zitadel-zitadel** (default).
# Issuer / ExternalDomain must match that FQDN (Option A):
#   http://zitadel-zitadel.auth.svc.cluster.local:8080
# (Later: chartValues.fullnameOverride: zitadel if we want a shorter name.)
#
# Shared cluster GitOps owns this XR after Configuration bootstrap.
apiVersion: hops.ops.com.ai/v1alpha1
kind: AuthStack
metadata:
  name: zitadel
  namespace: default
spec:
  clusterName: dory
  helmProviderConfigRef:
    name: default
  kubernetesProviderConfigRef:
    name: default

  # Install namespace
  namespace: auth

  # Must match Helm Service FQDN (default fullname = zitadel-zitadel)
  domain: zitadel-zitadel.auth.svc.cluster.local
  externalSecure: false

  gateway:
    enabled: false

  externalSecrets:
    enabled: false

  firstInstance:
    org: hops-ops
    masterkey:
      # Live Secret in install ns (auth) — not inline in gitops.
      #   kubectl -n auth create secret generic zitadel-masterkey \
      #     --from-literal=masterkey='hops-like-basketball-but-for-ops'
      # Chart expects the key material under the secret name; see AuthStack XRD.
      secretRef:
        name: zitadel-masterkey

  # Embedded PG lands in the same install namespace (auth).
  database:
    embedded:
      storage:
        size: 2Gi
        class: psql
