# Crossplane Configuration for platform SecretStack (ESO + AWS|Vault backends).
# Prefer source install for local dogfood of the multi-backend redesign:
#   hops config install --path <meta>/xrs/stacks/aws/secret --context dory
# Then this YAML is optional (or pin a published tag once released).
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: secret-stack
spec:
  # After `hops config install --path …/aws/secret`, package is local registry:
  # package: registry.crossplane-system.svc.cluster.local:5000/hops-ops/secret-stack:dev-<hash>
  package: ghcr.io/hops-ops/secret-stack:latest
  # packagePullPolicy: Always
