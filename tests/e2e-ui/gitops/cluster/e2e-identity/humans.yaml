# Demo humans — scripts/up.sh alice / bob / admin.
# Passwords: Secret e2e-human-passwords (residual — not in git).
#   kubectl create secret generic e2e-human-passwords -n default \
#     --from-literal=alice=Password1! \
#     --from-literal=bob=Password1! \
#     --from-literal=admin=Password1!
apiVersion: user.zitadel.m.crossplane.io/v1alpha1
kind: HumanUser
metadata:
  name: e2e-alice
  namespace: default
  labels:
    hops.ops.com.ai/app: e2e-ui
    hops.ops.com.ai/demo-user: alice
spec:
  forProvider:
    userName: alice
    firstName: alice
    lastName: E2E
    displayName: alice
    email: alice@e2e.local
    isEmailVerified: true
    initialSkipPasswordChange: true
    initialPasswordSecretRef:
      name: e2e-human-passwords
      key: alice
  providerConfigRef:
    name: default
    kind: ProviderConfig
---
apiVersion: user.zitadel.m.crossplane.io/v1alpha1
kind: HumanUser
metadata:
  name: e2e-bob
  namespace: default
  labels:
    hops.ops.com.ai/app: e2e-ui
    hops.ops.com.ai/demo-user: bob
spec:
  forProvider:
    userName: bob
    firstName: bob
    lastName: E2E
    displayName: bob
    email: bob@e2e.local
    isEmailVerified: true
    initialSkipPasswordChange: true
    initialPasswordSecretRef:
      name: e2e-human-passwords
      key: bob
  providerConfigRef:
    name: default
    kind: ProviderConfig
---
apiVersion: user.zitadel.m.crossplane.io/v1alpha1
kind: HumanUser
metadata:
  name: e2e-admin
  namespace: default
  labels:
    hops.ops.com.ai/app: e2e-ui
    hops.ops.com.ai/demo-user: admin
spec:
  forProvider:
    userName: admin
    firstName: admin
    lastName: E2E
    displayName: admin
    email: admin@e2e.local
    isEmailVerified: true
    initialSkipPasswordChange: true
    initialPasswordSecretRef:
      name: e2e-human-passwords
      key: admin
  providerConfigRef:
    name: default
    kind: ProviderConfig
