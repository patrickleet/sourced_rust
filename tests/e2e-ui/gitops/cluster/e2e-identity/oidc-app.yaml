# OIDC web app for e2e-ui Auth.js — scripts/up.sh e2e-ui-web.
# Redirects include workbench Service DNS + localhost for host access.
# Client secret is residual (observe status / Zitadel console on create).
apiVersion: application.zitadel.m.crossplane.io/v1alpha1
kind: Oidc
metadata:
  name: e2e-ui-web
  namespace: default
  labels:
    hops.ops.com.ai/app: e2e-ui
spec:
  forProvider:
    name: e2e-ui-web
    projectIdRef:
      name: e2e-ui
    appType: OIDC_APP_TYPE_WEB
    authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
    responseTypes:
      - OIDC_RESPONSE_TYPE_CODE
    grantTypes:
      - OIDC_GRANT_TYPE_AUTHORIZATION_CODE
      - OIDC_GRANT_TYPE_REFRESH_TOKEN
    accessTokenType: OIDC_TOKEN_TYPE_JWT
    accessTokenRoleAssertion: true
    idTokenRoleAssertion: true
    idTokenUserinfoAssertion: true
    devMode: true
    version: OIDC_VERSION_1_0
    redirectUris:
      # Workbench dogfood (cluster DNS / map)
      - http://e2e-ui-ui.hops-wt-dogfood.svc.cluster.local:5180/auth/callback/oidc
      - http://e2e-ui-ui.hops-wt-dogfood.svc.cluster.local:5180/auth/callback
      # Host map / local vite
      - http://127.0.0.1:5180/auth/callback/oidc
      - http://localhost:5180/auth/callback/oidc
      - http://127.0.0.1:18101/auth/callback/oidc
      - http://localhost:18101/auth/callback/oidc
    postLogoutRedirectUris:
      - http://e2e-ui-ui.hops-wt-dogfood.svc.cluster.local:5180/
      - http://127.0.0.1:5180/
      - http://localhost:5180/
      - http://127.0.0.1:18101/
      - http://localhost:18101/
    # Login V2 base = custom app login pages (Fieldnote UI), not stock zitadel-login.
    loginVersion:
      - loginV2:
          - baseUri: http://e2e-ui-ui.hops-wt-dogfood.svc.cluster.local:5180
  providerConfigRef:
    name: default
    kind: ProviderConfig
