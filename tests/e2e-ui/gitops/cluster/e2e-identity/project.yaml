# e2e-ui Zitadel project — replaces scripts/up.sh "Project e2e-ui"
apiVersion: project.zitadel.m.crossplane.io/v1alpha1
kind: Project
metadata:
  name: e2e-ui
  namespace: default
  labels:
    hops.ops.com.ai/app: e2e-ui
spec:
  forProvider:
    name: e2e-ui
    projectRoleAssertion: true
    projectRoleCheck: true
    hasProjectCheck: true
  providerConfigRef:
    name: default
    kind: ProviderConfig
