# Materialize AuthStack masterkey from Vault so it survives ns/worktree churn.
# Requires ClusterSecretStore vault Ready (Vault Helm postStart + vault-auth-delegator)
# and path auth/zitadel-masterkey written via: hops secrets sync vault
# See SECRETS.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: auth
  labels:
    hops.ops.com.ai/fixture: e2e-ui
    hops.ops.com.ai/secret: zitadel-masterkey
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: masterkey
      remoteRef:
        key: auth/zitadel-masterkey
        property: masterkey
