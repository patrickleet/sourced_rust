# Platform SecretStack for local CP (dory workbench).
#
# Install Configuration from source first (breaking API: hops.ops.com.ai):
#   hops config install --path <meta>/xrs/stacks/aws/secret --context dory
#
# Then: hops local gitops cluster ./gitops/cluster
#
# backend=vault + vault.install for local (no AWS PodIdentity required).
# clusterName/provider defaults match auth/psql stacks (helm PC name: default).
apiVersion: hops.ops.com.ai/v1alpha1
kind: SecretStack
metadata:
  name: external-secrets
  namespace: default
spec:
  clusterName: dory
  backend: vault
  namespace: external-secrets
  helmProviderConfigRef:
    name: default
  kubernetesProviderConfigRef:
    name: default
  labels:
    team: platform
    hops.ops.com.ai/fixture: e2e-ui
  secretStore:
    enabled: true
    scope: Cluster
    name: vault
  vault:
    install: true
    namespace: vault
    path: secret
    version: v2
    auth:
      method: kubernetes
      mountPath: kubernetes
      role: external-secrets
