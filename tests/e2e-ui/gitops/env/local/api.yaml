apiVersion: hops.local/v1alpha1
kind: Application
metadata:
  name: e2e-ui-api
spec:
  source:
    # Helm chart
    path: ../../../api/.gitops/deploy
    # Cargo workspace root (Cargo.toml) — NOT the empty api/ chart dir.
    deliveryPath: ../../..
    helm:
      values:
        local: true
        appRuntime: cluster-dev
  destination:
    namespace: hops-wt-default
  syncPolicy:
    prune: false
