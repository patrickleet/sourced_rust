apiVersion: hops.local/v1alpha1
kind: Application
metadata:
  name: e2e-ui-ui
spec:
  source:
    path: ../../../ui/.gitops/deploy
    # distributed monorepo root (ui needs tests/e2e-ui/ui + js/ for file: dep)
    deliveryPath: ../../../../..
    helm:
      values:
        local: true
        appRuntime: cluster-dev
        # Worktree OIDC project/users/app (requires AuthStack + ProviderConfig).
        # Set orgId residual after: GET …/management/v1/orgs/me
        identity:
          enabled: true
          orgId: "" # residual — required for roles/humans
  destination:
    namespace: hops-wt-default
  syncPolicy:
    prune: false
