apiVersion: hops.local/v1alpha1
kind: Application
metadata:
  name: e2e-ui-ui
spec:
  source:
    # Helm chart
    path: ../../../ui/.gitops/deploy
    # SvelteKit app root (package.json with vite dev) — NOT the monorepo root.
    deliveryPath: ../../../ui
    helm:
      values:
        local: true
        appRuntime: cluster-dev
  destination:
    namespace: hops-wt-default
  syncPolicy:
    prune: false
