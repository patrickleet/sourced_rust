{{- if .Values.local }}
{{- fail "api/.gitops/deploy is cloud-only; use api/.gitops/local for local=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "e2e-ui-api.name" . }}
  labels:
    {{- include "e2e-ui-api.labels" . | nindent 4 }}
    hops.ops.com.ai/runtime: package
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "e2e-ui-api.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "e2e-ui-api.name" . }}
        hops.ops.com.ai/runtime: package
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          env:
            - name: BIND
              value: {{ .Values.env.BIND | quote }}
