local: true
preview: false

environment:
  name: local
  namespace: default

name: e2e-ui-api
clusterDev:
  image: rust:1.94-bookworm
  workingDir: /workspace/tests/e2e-ui
  command:
    - /bin/bash
    - -c
    - |
      set -e
      cd /workspace/tests/e2e-ui
      if ! command -v cargo-watch >/dev/null 2>&1; then
        cargo install cargo-watch --locked
      fi
      # Watch source inputs only; the fixture root also contains Playwright
      # reports/auth state and Cargo's target output, which must not restart
      # the API while tests are running.
      cargo watch \
        -w /workspace/tests/e2e-ui/Cargo.toml \
        -w /workspace/tests/e2e-ui/Cargo.lock \
        -w /workspace/tests/e2e-ui/crates \
        -w /workspace/src \
        -w /workspace/distributed_cli \
        -w /workspace/distributed_macros \
        -w /workspace/Cargo.toml \
        -x 'run -p e2e-runner --bin e2e-ui'

identity:
  enabled: false
  # Must match the identity.workspace value passed to the UI and test-users
  # charts. Empty means the resolved Environment name.
  workspace: ""
  oidcGeneration: 0
  connectionSecretName: ""

service:
  port: 8791
  targetPort: 8791

env:
  BIND: "0.0.0.0:8791"
  DATABASE_URL: "sqlite:/tmp/e2e-ui.db?mode=rwc"
  OIDC_ISSUER: "http://zitadel-zitadel.auth.svc.cluster.local:8080"
  OIDC_AUDIENCE: ""
  OIDC_JWKS_URI: "http://zitadel-zitadel.auth.svc.cluster.local:8080/oauth/v2/keys"
  ZITADEL_PROJECT_ID: ""

secretEnv:
  ZITADEL_SERVICE_USER_TOKEN:
    secretName: e2e-ui-oidc
    key: ZITADEL_SERVICE_USER_TOKEN

sourceDelivery:
  # Hops local gitops replaces this sentinel with the Cluster mountRoot
  # hostPath before applying the Deployment. The chart is intentionally not a
  # standalone Helm checkout; its command expects the mounted workspace.
  mode: none
  hostPath: ""
  mountPath: /workspace
