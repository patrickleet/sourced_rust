apiVersion: v1
kind: Service
metadata:
  name: {{ include "e2e-ui-api.name" . }}
  labels:
    {{- include "e2e-ui-api.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "e2e-ui-api.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
