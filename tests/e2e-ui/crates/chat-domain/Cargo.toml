[package]
name = "chat-domain"
version.workspace = true
edition.workspace = true
publish = false
description = "ChatMessage aggregate for live chat (subscription demo)"

[dependencies]
# Path + default-features so the wasm cell worker can depend on this crate
# without pulling e2e-ui's sqlite/postgres/http/graphql feature set.
distributed = { path = "../../../..", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
