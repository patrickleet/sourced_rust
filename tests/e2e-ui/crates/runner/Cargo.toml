[package]
name = "e2e-runner"
version.workspace = true
edition.workspace = true
publish = false
description = "Thin runner: SQLite + SqliteBus + HTTP + GraphQL"

[[bin]]
name = "e2e-ui"
path = "src/main.rs"

[[bin]]
name = "e2e-export-sdl"
path = "src/bin/export_sdl.rs"

[[bin]]
name = "e2e-export-commands"
path = "src/bin/export_commands.rs"

[dependencies]
distributed = { workspace = true }
e2e-service = { path = "../service" }
tokio = { workspace = true }
