[package]
name = "todo-domain"
version.workspace = true
edition.workspace = true
publish = false
description = "Todo aggregate: create, rename, complete, reopen, archive (owner-scoped)"

[dependencies]
# Path + default-features so a wasm worker can depend on this crate without
# pulling e2e-ui's sqlite/postgres/http/graphql feature set. Those features
# still unify when this crate is built inside the e2e-ui workspace.
distributed = { path = "../../../..", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "1" }

[dev-dependencies]
serde_json = { version = "1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
