[package]
name = "blob-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Blob game domain: pure board core, aggregate host, optional WASM export"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["domain"]
# Aggregate + levels + distributed host (server / tests).
domain = ["dep:distributed", "dep:thiserror", "dep:rand"]
# Client pure export (wasm-pack / wasm32).
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
distributed = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
