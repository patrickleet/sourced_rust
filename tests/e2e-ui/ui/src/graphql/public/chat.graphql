# Anonymous surface copy: authorization surfaces own distinct source files even
# when the selected fields and nested-layout boundary are intentionally equal.
query ChatMessages($limit: Int!, $offset: Int!) @load @live {
  chat_messages(
    where: { room_id: { _eq: "lobby" } }
    limit: $limit
    offset: $offset
    order_by: [{ created_at: desc }]
  ) {
    message_id
    room_id
    author_id
    body
    created_at
    author {
      user_id
      display_name
      email
    }
  }
}
