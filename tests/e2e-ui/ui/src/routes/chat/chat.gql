# Co-located lobby chat **query + subscription**.
# Room filter is fixed to lobby for the e2e-ui page; variables can expand later.
# Post mutation: `$lib/api/commands.operations.gql` (generated).

# Lobby chat — joins `author` from imported auth_users (Zitadel ingestor).
query ChatMessages {
  chat_messages(where: { room_id: { _eq: "lobby" } }) {
    message_id
    room_id
    author_id
    body
    created_at
    author {
      user_id
      display_name
      email
      status
    }
  }
}

subscription ChatMessagesLive {
  chat_messages(where: { room_id: { _eq: "lobby" } }) {
    message_id
    room_id
    author_id
    body
    created_at
    author {
      user_id
      display_name
      email
      status
    }
  }
}
