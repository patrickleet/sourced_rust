# Co-located lobby chat operations (Houdini-inspired).
# Room filter is fixed to lobby for the e2e-ui page; variables can expand later.

query ChatMessages {
  chat_messages(where: { room_id: { _eq: "lobby" } }) {
    message_id
    room_id
    author_id
    body
    created_at
  }
}

subscription ChatMessagesLive {
  chat_messages(where: { room_id: { _eq: "lobby" } }) {
    message_id
    room_id
    author_id
    body
    created_at
  }
}

mutation ChatPost($message_id: String!, $body: String!, $room_id: String!) {
  chat_messages_post(
    input: { message_id: $message_id, body: $body, room_id: $room_id }
  ) {
    message_id
    room_id
    author_id
    body
    created_at
  }
}
