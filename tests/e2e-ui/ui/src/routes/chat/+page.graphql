# Newest page is live (offset 0). Older pages load via the same operation
# with rising offset; the UI merges by message_id and displays ascending.
query ChatMessages($limit: Int!, $offset: Int!) @load @live {
  chat_messages(
    where: { room_id: { _eq: "lobby" } }
    limit: $limit
    offset: $offset
    order_by: [{ created_at: desc }]
  ) {
    message_id
    room_id
    author_id
    body
    created_at
    author {
      user_id
      display_name
      email
    }
  }
}
