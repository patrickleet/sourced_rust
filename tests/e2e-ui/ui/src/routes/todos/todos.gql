# Co-located todos **queries** (Houdini-inspired).
# Command mutations: see `$lib/api/commands.operations.gql` (generated from Rust).
# Run `npm run gen:gql` after query edits; `make gen-commands` for mutations.

query Todos {
  # Deterministic server order (SSR + refetch). Client also re-sorts for status buckets.
  todos(order_by: [{ status: asc }, { todo_id: asc }]) {
    todo_id
    owner_id
    title
    status
  }
}
