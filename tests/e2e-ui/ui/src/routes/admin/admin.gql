# Admin-only page ops.
# - Query: same `todos` field; admin role has no owner filter.
# - Mutation: `todos_force_archive` is registered ONLY for role admin
#   (absent from user SDL / GraphQL schema for non-admins).

query AdminAllTodos {
  todos {
    todo_id
    owner_id
    title
    status
  }
}

mutation AdminForceArchive($todo_id: String!) {
  todos_force_archive(input: { todo_id: $todo_id }) {
    todo_id
    owner_id
    status
    archived_by
  }
}
