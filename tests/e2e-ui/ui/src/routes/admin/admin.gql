# Admin-only page ops. Same GraphQL field as personal todos, but the engine
# role `admin` has no owner_id row filter (see build_graphql_engine ModelPermissions).
# User role can run this query too — they only receive their own rows; the /admin
# route is gated so only admins open this UI.

query AdminAllTodos {
  todos {
    todo_id
    owner_id
    title
    status
  }
}
