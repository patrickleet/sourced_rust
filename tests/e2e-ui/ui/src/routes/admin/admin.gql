# Admin-only page ops.
# - Query: same `todos` field; admin role has no owner filter.
# - Bound with limit + order_by (do not load unbounded RM into the browser).
# - Mutation: `todos_force_archive` is registered ONLY for role admin.

query AdminAllTodos {
  todos(limit: 100, order_by: [{ todo_id: asc }]) {
    todo_id
    owner_id
    title
    status
  }
}

mutation AdminForceArchive($todo_id: String!) {
  todos_force_archive(input: { todo_id: $todo_id }) {
    todo_id
    owner_id
    status
    archived_by
  }
}
