# Admin-only page **query**.
# - Same `todos` field; admin role has no owner filter.
# - Bound with limit + order_by (do not load unbounded RM into the browser).
# Force-archive mutation: `$lib/api/commands.operations.gql` (generated).

query AdminAllTodos {
  # Deterministic: status buckets then owner then id
  todos(limit: 100, order_by: [{ status: asc }, { owner_id: asc }, { todo_id: asc }]) {
    todo_id
    owner_id
    title
    status
  }
}
