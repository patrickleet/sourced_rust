# Cloud workload values. Local development is ui/.gitops/local.
local: false
preview: false

name: e2e-ui-ui
image:
  repository: ghcr.io/hops-ops/e2e-ui-ui
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 5180
  targetPort: 5180

env:
  HOST: "0.0.0.0"
  PORT: "5180"
  E2E_API_ORIGIN: "http://e2e-ui-api:8791"
  AUTH_TRUST_HOST: "true"

secretEnv:
  AUTH_SECRET:
    secretName: e2e-ui-oidc
    key: AUTH_SECRET
  OIDC_CLIENT_ID:
    secretName: e2e-ui-oidc
    key: OIDC_CLIENT_ID
  OIDC_CLIENT_SECRET:
    secretName: e2e-ui-oidc
    key: OIDC_CLIENT_SECRET
