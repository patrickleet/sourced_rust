{{- /*
  Cluster-shared Zitadel Project (one e2e-ui project for the whole CP).

  Roles and demo humans attach here. OIDC apps stay worktree-scoped and
  projectIdRef this name.
*/ -}}
{{- if .Values.identity.enabled }}
{{- $name := include "e2e-ui-ui.clusterProjectName" . -}}
{{- $ns := .Values.identity.projectNamespace | default .Values.identity.mrNamespace | default "default" -}}
apiVersion: project.zitadel.m.crossplane.io/v1alpha1
kind: Project
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "e2e-ui-ui.identityClusterLabels" . | nindent 4 }}
    auth.hops.ops.com.ai/reference-name: {{ $name }}
spec:
  forProvider:
    name: {{ $name | quote }}
    projectRoleAssertion: true
    # Reject authentication unless a GitOps-owned Grant assigns a project role.
    projectRoleCheck: true
    hasProjectCheck: true
  providerConfigRef:
    name: {{ .Values.identity.providerConfigRef.name | default "default" | quote }}
    kind: {{ .Values.identity.providerConfigRef.kind | default "ProviderConfig" | quote }}
{{- end }}
