{{- $imageTag := required "image.tag is required for cloud deployments" .Values.image.tag | toString -}}
{{- if not (regexMatch "^(v[0-9]+[.][0-9]+[.][0-9]+|pr-[0-9]+-[0-9a-f]{40})$" $imageTag) -}}
{{- fail (printf "image.tag must match vMAJOR.MINOR.PATCH or pr-NUMBER-40_HEX_SHA; got %q" $imageTag) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "e2e-ui-ui.name" . }}
  labels:
    {{- include "e2e-ui-ui.labels" . | nindent 4 }}
    hops.ops.com.ai/runtime: package
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "e2e-ui-ui.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "e2e-ui-ui.name" . }}
        hops.ops.com.ai/runtime: package
    spec:
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
