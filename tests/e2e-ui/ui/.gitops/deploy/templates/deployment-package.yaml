{{- $imageTag := required "image.tag must be an immutable build tag for cloud deployments" .Values.image.tag -}}
{{- if eq $imageTag "latest" -}}
{{- fail "image.tag=latest is not allowed for cloud deployments; supply a release/build tag" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "e2e-ui-ui.name" . }}
  labels:
    {{- include "e2e-ui-ui.labels" . | nindent 4 }}
    hops.ops.com.ai/runtime: package
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "e2e-ui-ui.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "e2e-ui-ui.name" . }}
        hops.ops.com.ai/runtime: package
    spec:
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
