{{- /*
  Local cluster-dev residual Secret so pods can schedule before Vault/ExternalSecrets
  (or live OIDC client credentials) are wired.

  Keys are placeholders for HMR / delivery dogfood. Replace via ExternalSecrets
  (externalSecrets.enabled) or a real residual after OIDC is Ready for login tests.

  Enabled when local=true and identity.seedLocalOidcSecret is not false.
*/ -}}
{{- if and .Values.local (ne .Values.identity.seedLocalOidcSecret false) }}
{{- $name := (.Values.secretEnv.OIDC_CLIENT_ID.secretName | default "e2e-ui-oidc") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "e2e-ui-ui.labels" . | nindent 4 }}
    hops.ops.com.ai/app: e2e-ui
    hops.ops.com.ai/secret: oidc-local-seed
type: Opaque
stringData:
  AUTH_SECRET: {{ .Values.identity.localOidcSeed.authSecret | default "local-workbench-dev-auth-secret-not-for-prod" | quote }}
  OIDC_CLIENT_ID: {{ .Values.identity.localOidcSeed.clientId | default "local-dev-client-id" | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.identity.localOidcSeed.clientSecret | default "local-dev-client-secret" | quote }}
  ZITADEL_SERVICE_USER_TOKEN: {{ .Values.identity.localOidcSeed.serviceUserToken | default "local-dev-service-user-token" | quote }}
{{- end }}
