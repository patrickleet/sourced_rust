{{- if and .Values.externalSecrets .Values.externalSecrets.enabled .Values.externalSecrets.humanPasswords .Values.externalSecrets.humanPasswords.enabled }}
{{- $path := .Values.externalSecrets.humanPasswords.vaultPath | default "e2e-ui/shared/human-passwords" -}}
{{- $target := .Values.externalSecrets.humanPasswords.targetName | default "e2e-human-passwords" -}}
{{- $ns := .Values.identity.humansNamespace | default .Values.identity.mrNamespace | default "default" -}}
# Cluster-shared password secret for demo HumanUsers (not per-worktree).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $target }}
  namespace: {{ $ns }}
  labels:
    {{- include "e2e-ui-ui.labels" . | nindent 4 }}
    hops.ops.com.ai/app: e2e-ui
    hops.ops.com.ai/secret: human-passwords
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1m" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | default "vault" | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" | quote }}
  target:
    name: {{ $target | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          hops.ops.com.ai/app: e2e-ui
  data:
    - secretKey: alice
      remoteRef:
        key: {{ $path | quote }}
        property: alice
    - secretKey: bob
      remoteRef:
        key: {{ $path | quote }}
        property: bob
    - secretKey: admin
      remoteRef:
        key: {{ $path | quote }}
        property: admin
{{- end }}
