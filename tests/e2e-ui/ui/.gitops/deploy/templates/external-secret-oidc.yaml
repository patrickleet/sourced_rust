{{- if and .Values.externalSecrets .Values.externalSecrets.enabled }}
{{- $ws := include "e2e-ui-ui.workspace" . -}}
{{- $path := .Values.externalSecrets.oidc.vaultPath | default (printf "e2e-ui/%s/oidc" $ws) -}}
{{- $target := .Values.externalSecrets.oidc.targetName | default "e2e-ui-oidc" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $target }}
  labels:
    {{- include "e2e-ui-ui.labels" . | nindent 4 }}
    hops.ops.com.ai/app: e2e-ui
    hops.ops.com.ai/workspace: {{ $ws | quote }}
    hops.ops.com.ai/secret: oidc
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1m" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | default "vault" | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" | quote }}
  target:
    name: {{ $target | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          hops.ops.com.ai/app: e2e-ui
          hops.ops.com.ai/workspace: {{ $ws | quote }}
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: {{ $path | quote }}
        property: AUTH_SECRET
    - secretKey: ZITADEL_SERVICE_USER_TOKEN
      remoteRef:
        key: {{ $path | quote }}
        property: ZITADEL_SERVICE_USER_TOKEN
{{- end }}
