{{- if eq .Values.appRuntime "cluster-dev" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "e2e-ui-ui.name" . }}
  labels:
    {{- include "e2e-ui-ui.labels" . | nindent 4 }}
    hops.ops.com.ai/runtime: cluster-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "e2e-ui-ui.name" . }}
  template:
    metadata:
      annotations:
        hops.ops.com.ai/source-generation: {{ .Values.clusterDev.sourceGeneration | default 0 | quote }}
        {{- if .Values.identity.enabled }}
        hops.ops.com.ai/oidc-generation: {{ .Values.identity.oidcGeneration | default 0 | quote }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "e2e-ui-ui.name" . }}
        hops.ops.com.ai/runtime: cluster-dev
    spec:
      containers:
        - name: ui
          image: {{ .Values.clusterDev.image | quote }}
          workingDir: {{ .Values.clusterDev.workingDir | quote }}
          {{- if eq .Values.sourceDelivery.mode "sync" }}
          # Wait for tar/mutagen delivery, then run the same clusterDev command.
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "waiting for source sync at {{ .Values.sourceDelivery.mountPath }}..."
              waited=0
              while [ ! -f {{ .Values.sourceDelivery.mountPath }}/.hops-synced ] \
                && [ ! -f {{ .Values.clusterDev.workingDir }}/package.json ]; do
                sleep 2
                waited=$((waited + 2))
                if [ $((waited % 30)) -eq 0 ]; then
                  echo "still waiting for hops source sync (${waited}s) — is tar watcher running?"
                fi
                if [ "$waited" -ge 600 ]; then
                  echo "ERROR: source sync timeout after ${waited}s (no .hops-synced / package.json)"
                  exit 1
                fi
              done
              echo "source present; starting dev process"
              {{- /* Unwrap Values.clusterDev.command ["/bin/bash","-c","script"] */ -}}
              {{- $cmd := .Values.clusterDev.command -}}
              {{- if and (kindIs "slice" $cmd) (ge (len $cmd) 3) }}
              {{ index $cmd 2 | nindent 14 }}
              {{- else }}
              cd /workspace/js && npm install && npm run build
              cd {{ .Values.clusterDev.workingDir }}
              npm install
              export DISTRIBUTED_SKIP_CLIENT_COMPILE=1
              export E2E_API_ORIGIN="${E2E_API_ORIGIN:-http://e2e-ui-api:8791}"
              npm run dev -- --host 0.0.0.0 --port {{ .Values.service.targetPort }}
              {{- end }}
          {{- else }}
          command:
            {{- toYaml .Values.clusterDev.command | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          env:
            {{- range $k, $v := .Values.env }}
            {{- if and (eq $k "AUTH_URL") $.Values.namespace }}
            - name: AUTH_URL
              value: {{ printf "http://e2e-ui-ui.%s.svc.cluster.local:5180" $.Values.namespace | quote }}
            {{- else if and $v (ne $v "") }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- /* Client creds from Oidc writeConnectionSecretToRef (attribute.*) */ -}}
            {{- $oidcConn := include "e2e-ui-ui.oidcConnectionSecretName" . -}}
            {{- range $k, $ref := .Values.secretEnv }}
            {{- if and $.Values.identity.enabled (or (eq $k "OIDC_CLIENT_ID") (eq $k "OIDC_CLIENT_SECRET")) }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $oidcConn | quote }}
                  key: {{ if eq $k "OIDC_CLIENT_ID" }}attribute.client_id{{ else }}attribute.client_secret{{ end }}
            {{- else }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName | quote }}
                  key: {{ $ref.key | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: source
              mountPath: {{ .Values.sourceDelivery.mountPath }}
            - name: node-modules
              mountPath: {{ .Values.clusterDev.workingDir }}/node_modules
            # Keep monorepo js deps across restarts within the same pod lifecycle.
            - name: js-node-modules
              mountPath: /workspace/js/node_modules
      volumes:
        - name: source
          {{- if eq .Values.sourceDelivery.mode "hostPath" }}
          hostPath:
            path: {{ .Values.sourceDelivery.hostPath | quote }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: node-modules
          emptyDir: {}
        - name: js-node-modules
          emptyDir: {}
{{- end }}
