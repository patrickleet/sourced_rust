{{- /* Test-user chart ownership.
  Local residual Secret for non-MR credentials only.

  OIDC client id/secret come from the Oidc MR connection Secret
  (identity-oidc writeConnectionSecretToRef) — not placeholders here.
  ZITADEL_SERVICE_USER_TOKEN is a residual copied from the AuthStack
  login-client PAT (or materialized by ExternalSecrets when enabled).

  AUTH_SECRET is a stable local session key (not from Zitadel).
*/ -}}
{{- /*
  Local residual Secret for session/login PAT only.
  OIDC client id/secret: Oidc MR writeConnectionSecretToRef (attribute.*).
  Never put live client ids or org/project ids in git.
*/ -}}
{{- if and .Values.local (ne .Values.identity.seedLocalOidcSecret false) }}
apiVersion: v1
kind: Secret
metadata:
  name: e2e-ui-oidc
  labels:
    {{- include "e2e-ui-ui.labels" . | nindent 4 }}
    hops.ops.com.ai/app: e2e-ui
    hops.ops.com.ai/secret: oidc-local-seed
type: Opaque
stringData:
  AUTH_SECRET: {{ .Values.identity.localOidcSeed.authSecret | default "local-workbench-dev-auth-secret-not-for-prod" | quote }}
  {{- /* Optional explicit seed; prefer the residual workflow in SECRETS.md. */ -}}
  {{- if .Values.identity.localOidcSeed.serviceUserToken }}
  ZITADEL_SERVICE_USER_TOKEN: {{ .Values.identity.localOidcSeed.serviceUserToken | quote }}
  {{- end }}
{{- end }}
