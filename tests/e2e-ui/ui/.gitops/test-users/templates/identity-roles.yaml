{{- /* Test-user chart ownership.
  Cluster-shared project roles (user / admin) on the shared e2e-ui Project.
  The project reference supplies the organization context; no generated
  organization UUID is stored in this chart.
*/ -}}
{{- if .Values.identity.enabled }}
{{- $project := include "e2e-ui-ui.clusterProjectName" . -}}
{{- $ns := .Values.identity.projectNamespace | default .Values.identity.mrNamespace | default "default" -}}
{{- $pc := .Values.identity.providerConfigRef.name | default "default" -}}
{{- $pck := .Values.identity.providerConfigRef.kind | default "ProviderConfig" -}}
apiVersion: project.zitadel.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: e2e-role-user
  namespace: {{ $ns }}
  labels:
    {{- include "e2e-ui-ui.identityClusterLabels" . | nindent 4 }}
    hops.ops.com.ai/demo-role: user
spec:
  forProvider:
    # provider-upjet-zitadel requires the field, while the project reference
    # supplies the organization context. Keep it empty rather than copying a
    # generated Zitadel UUID into GitOps.
    orgId: ""
    roleKey: user
    displayName: user
    projectIdRef:
      name: {{ $project }}
  providerConfigRef:
    name: {{ $pc | quote }}
    kind: {{ $pck | quote }}
---
apiVersion: project.zitadel.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: e2e-role-admin
  namespace: {{ $ns }}
  labels:
    {{- include "e2e-ui-ui.identityClusterLabels" . | nindent 4 }}
    hops.ops.com.ai/demo-role: admin
spec:
  forProvider:
    orgId: ""
    roleKey: admin
    displayName: admin
    projectIdRef:
      name: {{ $project }}
  providerConfigRef:
    name: {{ $pc | quote }}
    kind: {{ $pck | quote }}
{{- end }}
