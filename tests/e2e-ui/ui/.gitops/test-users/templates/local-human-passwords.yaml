{{- /* Test-user chart ownership.
  Cluster-shared demo human passwords (alice/bob/admin).
  Declarative local seed so HumanUser MRs can create without manual kubectl.
  Not for production — ExternalSecrets when externalSecrets.humanPasswords.enabled.
*/ -}}
{{- if and .Values.local .Values.identity.enabled .Values.identity.demoUsers (ne .Values.identity.seedLocalHumanPasswords false) }}
{{- $name := .Values.identity.passwordSecret.name | default "e2e-human-passwords" -}}
{{- $ns := .Values.identity.humansNamespace | default .Values.identity.projectNamespace | default "default" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "e2e-ui-ui.identityClusterLabels" . | nindent 4 }}
    hops.ops.com.ai/secret: e2e-human-passwords
type: Opaque
stringData:
  alice: {{ .Values.identity.localHumanPasswords.alice | default "Password1!" | quote }}
  bob: {{ .Values.identity.localHumanPasswords.bob | default "Password1!" | quote }}
  admin: {{ .Values.identity.localHumanPasswords.admin | default "Password1!" | quote }}
{{- end }}
