[workspace]
members = ["."]
resolver = "2"

[package]
name = "celld-events-relay-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "celld Queue consumer that relays canonical messages to a native Distributed bus"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
distributed = { path = "../../..", default-features = false, features = ["workers-rs"] }
worker = { version = "0.8", features = ["queue"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
