# celld 0.4 development mode uses a local object store under PROJECT/.celld/dev.
# The nested named volume keeps that state durable while the Worker source and
# build output remain a read-only bind mount.

services:
  celld:
    image: ghcr.io/denoland/celld:0.4.0
    restart: unless-stopped
    init: true
    command:
      - dev
      - /worker
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --logs
    ports:
      - "127.0.0.1:${CELLD_HTTP_PORT:-18080}:8080"
    volumes:
      - ./worker:/worker:ro
      - celld-dev-data:/worker/.celld
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  celld-dev-data:
