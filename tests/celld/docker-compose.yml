# One celld node for tests/celld.
#
# Requires a *qualified* object store (S3, R2, Tigris, GCS, Azure). MinIO
# community, DO Spaces, B2, and Hetzner do not implement the conditional
# writes celld uses for fencing — do not point CELLD_BUCKET at them.
#
#   export CELLD_BUCKET=s3://your-bucket
#   export AWS_ACCESS_KEY_ID=...
#   export AWS_SECRET_ACCESS_KEY=...
#   # R2 / Tigris:
#   export CELLD_ENDPOINT=https://ACCOUNT.r2.cloudflarestorage.com
#   export CELLD_REGION=auto
#
#   docker compose -f tests/celld/docker-compose.yml up -d --wait
#   celld deploy tests/celld/worker --bucket "$CELLD_BUCKET" \
#     ${CELLD_ENDPOINT:+--endpoint "$CELLD_ENDPOINT"} \
#     ${CELLD_REGION:+--region "$CELLD_REGION"}
#   CELLD_URL=http://127.0.0.1:18080 cargo test --test celld
#
# Port 8081 is peer/internal. Do not publish it.

services:
  celld:
    image: ghcr.io/denoland/celld
    restart: always
    hostname: celld
    ports:
      - "18080:8080"
    expose:
      - "8081"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      CELLD_WATCH: /var/lib/celld/state
      CELLD_BUCKET: ${CELLD_BUCKET:?set CELLD_BUCKET to a qualified s3:// gs:// or az:// URL}
      CELLD_ENDPOINT: ${CELLD_ENDPOINT:-}
      CELLD_REGION: ${CELLD_REGION:-}
      CELLD_ADVERTISE: celld:8081
    volumes:
      - celld-state:/var/lib/celld
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

volumes:
  celld-state:
