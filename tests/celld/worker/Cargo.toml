[workspace]
members = ["."]
resolver = "2"

[package]
name = "todo-cell-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "workers-rs Todo cell: AggregateCell + todo-domain handles"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
distributed = { path = "../../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
todo-domain = { path = "../../e2e-ui/crates/todo-domain" }
worker = "0.8"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
