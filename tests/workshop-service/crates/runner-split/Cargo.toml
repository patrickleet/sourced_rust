[package]
name = "workshop-runner-split"
version.workspace = true
edition.workspace = true
publish = false
description = "Multi-service runners: catalog vs orders handlers in separate processes"

[[bin]]
name = "workshop-catalog"
path = "src/bin/catalog.rs"

[[bin]]
name = "workshop-orders"
path = "src/bin/orders.rs"

[[bin]]
name = "workshop-split-all"
path = "src/bin/split_all.rs"

[dependencies]
distributed = { workspace = true }
workshop-service = { path = "../service" }
workshop-readmodels = { path = "../readmodels" }
tokio = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
