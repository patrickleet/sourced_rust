# Nested workspace fixture: multi-BC workshop domain (catalog + orders).
# Not a member of the main `distributed` workspace — run from this directory:
#   cargo test --workspace
#   cargo run -p workshop-runner-monolith
[workspace]
resolver = "2"
members = [
    "crates/catalog-domain",
    "crates/orders-domain",
    "crates/readmodels",
    "crates/service",
    "crates/runner-monolith",
    "crates/runner-split",
    "crates/suite",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
distributed = { path = "../..", features = ["sqlite", "http", "graphql", "metrics"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
thiserror = "1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tower = { version = "0.5", features = ["util"] }
