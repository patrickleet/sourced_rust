[package]
name = "distributed_macros"
version.workspace = true
edition.workspace = true
description = "Procedural macros for distributed"
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "visit"] }

[dev-dependencies]
# Compile-fail snapshots depend on trybuild's compiler-diagnostic normalization.
trybuild = "=1.0.118"
# Dev-only cycle: `distributed` depends on this crate, but trybuild fixtures
# need the runtime crate to type-check generated `distributed::...` code.
# Cargo permits dev-dependency cycles.
distributed = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
