# Reusable: create a GitHub Release for a version tag (no crates.io, no binary).
#
# Use for private domain crates (or any library that versions with vnext but is
# not published). Pair with unbounded-tech/workflow-vnext-tag on main.
#
#   on:
#     push:
#       tags: ["v*.*.*"]
#   jobs:
#     release:
#       uses: hops-ops/distributed/.github/workflows/github-release.yaml@main

name: Distributed GitHub Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (defaults to github.ref_name on the caller)
        type: string
        required: false
        default: ""

      name:
        description: Release title (defaults to the tag)
        type: string
        required: false
        default: ""

      generate_release_notes:
        description: Let GitHub auto-generate notes from commits/PRs
        type: boolean
        required: false
        default: true

      prerelease:
        description: Mark release as prerelease
        type: boolean
        required: false
        default: false

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag and title
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          NAME="${{ inputs.name }}"
          if [ -z "$NAME" ]; then
            NAME="$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Creating release tag=$TAG name=$NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.name }}
          NOTES: ${{ inputs.generate_release_notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(release create "$TAG" --title "$TITLE" --verify-tag)
          if [ "$NOTES" = "true" ]; then
            args+=(--generate-notes)
          else
            args+=(--notes "")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          # Idempotent: if the release already exists, succeed.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving as-is"
            exit 0
          fi
          gh "${args[@]}"
