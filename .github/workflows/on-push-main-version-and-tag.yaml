name: On Push to Main, Version and Tag For Release

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: write
  pull-requests: write

jobs:
  quality:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/quality.yaml
    with:
      cargo_build_args: "--verbose"
      cargo_test_args: "--verbose"
      cargo_llvm_cov_args: "--workspace"

  all-features:
    uses: ./.github/workflows/test-all-features.yaml

  postgres:
    uses: ./.github/workflows/integration-postgres.yaml

  nats:
    uses: ./.github/workflows/integration-nats.yaml

  rabbitmq:
    uses: ./.github/workflows/integration-rabbitmq.yaml

  kafka:
    uses: ./.github/workflows/integration-kafka.yaml

  distributed-cli:
    uses: ./.github/workflows/integration-distributed-cli.yaml

  observability:
    uses: ./.github/workflows/integration-observability.yaml

  # Conventional commits drive the next tag. chore: alone does not bump.
  # Deploy key required so the tag push can chain into on-v-tag-publish.
  version-and-tag:
    name: Version and Tag
    needs:
      [
        quality,
        all-features,
        postgres,
        nats,
        rabbitmq,
        kafka,
        distributed-cli,
        observability,
      ]
    uses: unbounded-tech/workflow-vnext-tag/.github/workflows/workflow.yaml@v1.21.5
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    with:
      useDeployKey: true
      rust: true
