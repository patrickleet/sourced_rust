name: On Version Tagged, Publish Crates and CLI Artifacts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish-macros:
    uses: unbounded-tech/workflows-rust/.github/workflows/publish.yaml@feat/cargo-publish
    secrets:
      crates_io_token: ${{ secrets.CRATES_IO_TOKEN }}
    with:
      manifest_path: distributed_macros/Cargo.toml
      cargo_publish_args: "--locked"

  # distributed_cli (the `dctl` binary + generation library) has no internal
  # workspace dependencies, so it publishes independently of the macros/core crates.
  publish-cli:
    uses: unbounded-tech/workflows-rust/.github/workflows/publish.yaml@feat/cargo-publish
    secrets:
      crates_io_token: ${{ secrets.CRATES_IO_TOKEN }}
    with:
      manifest_path: distributed_cli/Cargo.toml
      cargo_publish_args: "--locked"

  publish:
    needs: publish-macros
    uses: unbounded-tech/workflows-rust/.github/workflows/publish.yaml@feat/cargo-publish
    secrets:
      crates_io_token: ${{ secrets.CRATES_IO_TOKEN }}
    with:
      manifest_path: Cargo.toml
      cargo_publish_args: "--locked"

  # `publish` waits for the macros crate, while `publish-cli` is independent.
  # Gate binary artifacts on both so all three crates publish first.
  release:
    needs: [publish, publish-cli]
    permissions:
      contents: write
    uses: unbounded-tech/workflows-rust/.github/workflows/release.yaml@v2.3.0
    with:
      binary_name: dctl
      # Cargo.lock is intentionally untracked for this library workspace.
      build_args: "--release --package distributed_cli --bin dctl"
