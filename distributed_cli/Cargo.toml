[package]
name = "distributed_cli"
description = "The `dctl` CLI for Distributed services: scaffold projects, describe their manifest, and render schema artifacts (SQL or Atlas Operator resources). Also a library so other CLIs (e.g. hops) can mount its commands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dctl"
path = "src/main.rs"

[dependencies]
async-graphql-parser = "7"
async-graphql-value = "7"
base64 = "0.22.1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps QuerySpec object key order stable when lowering to GraphQL
# so dual-authored operations hash identically to hand-written documents.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
