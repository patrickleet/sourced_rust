services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sourced
      POSTGRES_PASSWORD: sourced
      POSTGRES_DB: sourced_rust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourced -d sourced_rust"]
      interval: 2s
      timeout: 5s
      retries: 20
